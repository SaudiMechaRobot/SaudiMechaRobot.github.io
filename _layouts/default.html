{%- include i18n.html -%}
<!doctype html>
<html lang="{{ L }}" dir="{{ t.dir }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}
{%- if alts.size > 1 %}
{%- for a in alts %}
<link rel="alternate" hreflang="{{ a.lang | default: 'ar' }}" href="{{ a.url | absolute_url }}">
{%- assign al = a.lang | default: "ar" %}{% if al == "ar" %}
<link rel="alternate" hreflang="x-default" href="{{ a.url | absolute_url }}">{% endif %}
{%- endfor %}
{%- endif %}
<link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
<link rel="icon" href="{{ '/favicon.png' | relative_url }}" type="image/png">
<link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">
<meta name="theme-color" content="#070B10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800&family=Saira+Stencil+One&{% if L == "ja" %}family=Noto+Sans+JP:wght@400;500;700;900&{% endif %}family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
{% feed_meta %}
{% include schema.html %}
</head>
<body>
<div class="langbar" id="langbar" hidden>
  <div class="wrap">
    <span id="langbar-text"></span><a id="langbar-link" href="#"></a>
    <button type="button" id="langbar-close" aria-label="Close">×</button>
  </div>
</div>
<script type="application/json" id="lang-data">{
  {%- for pair in lang_urls %}{% assign kv = pair | split: "|" %}{% assign lt = site.data.i18n[kv[0]] %}
  "{{ kv[0] }}": {"url": {{ kv[1] | relative_url | jsonify }}, "text": {{ lt.suggest_text | jsonify }}, "link": {{ lt.suggest_link | jsonify }}, "dir": "{{ lt.dir }}"}{% unless forloop.last %},{% endunless %}
  {%- endfor %}
}</script>
{% include header.html %}
{{ content }}
{% include footer.html %}
<script>
(function(){
  var cur = document.documentElement.lang;
  var data = {};
  try { data = JSON.parse(document.getElementById("lang-data").textContent); } catch (e) { return; }
  var langs = (navigator.languages || [navigator.language || ""]).map(function(l){ return (l || "").toLowerCase().slice(0,2); });
  var want = null;
  for (var i = 0; i < langs.length; i++) { if (data[langs[i]]) { want = langs[i]; break; } }
  if (!want) want = "en";
  if (want === cur) return;
  try { if (localStorage.getItem("smr-langbar") === "closed") return; } catch (e) {}
  var d = data[want], bar = document.getElementById("langbar");
  var txt = document.getElementById("langbar-text"), link = document.getElementById("langbar-link");
  txt.textContent = d.text; txt.lang = want; link.textContent = d.link; link.href = d.url; link.lang = want; link.hreflang = want;
  bar.dir = d.dir; bar.hidden = false;
  document.getElementById("langbar-close").addEventListener("click", function(){ bar.hidden = true; try { localStorage.setItem("smr-langbar","closed"); } catch (e) {} });
})();
</script>
</body>
</html>
