# لوحة تحكم Pages CMS — https://app.pagescms.org
media:
  input: assets/images
  output: /assets/images

content:
  - name: posts
    label: المدونة
    type: collection
    path: _posts
    filename: { template: "{year}-{month}-{day}-{primary}.md", field: create }
    view: { primary: title, sort: date, order: desc, fields: [title, date, category] }
    fields:
      - { name: title, label: العنوان, type: string, required: true }
      - { name: ref, label: "مفتاح الربط بالترجمة (نفس الكلمة في المقال الإنجليزي، مثل: first-gunpla-guide)", type: string }
      - { name: date, label: التاريخ, type: date, required: true }
      - { name: description, label: وصف قصير (يظهر في Google), type: text }
      - name: category
        label: التصنيف
        type: select
        options:
          values: [GUIDE, EVENT, NEWS, TOOLS, REVIEW]
      - { name: cover, label: صورة الغلاف, type: image }
      - { name: body, label: المحتوى, type: rich-text }

  - name: posts_en
    label: المدونة (English)
    type: collection
    path: _posts/en
    filename: { template: "{year}-{month}-{day}-{primary}.md", field: create }
    view: { primary: title, sort: date, order: desc, fields: [title, date, category] }
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: ref, label: "Translation key (same as the Arabic post)", type: string }
      - { name: date, label: Date, type: date, required: true }
      - { name: description, label: Short description (shown in Google), type: text }
      - name: category
        label: Category
        type: select
        options:
          values: [GUIDE, EVENT, NEWS, TOOLS, REVIEW]
      - { name: cover, label: Cover image, type: image }
      - { name: body, label: Content, type: rich-text }

  - name: posts_ja
    label: المدونة (日本語)
    type: collection
    path: _posts/ja
    filename: { template: "{year}-{month}-{day}-{primary}.md", field: create }
    view: { primary: title, sort: date, order: desc, fields: [title, date, category] }
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: ref, label: "Translation key (same as the Arabic post)", type: string }
      - { name: date, label: Date, type: date, required: true }
      - { name: description, label: Short description (shown in Google), type: text }
      - name: category
        label: Category
        type: select
        options:
          values: [GUIDE, EVENT, NEWS, TOOLS, REVIEW]
      - { name: cover, label: Cover image, type: image }
      - { name: body, label: Content, type: rich-text }

  - name: achievements
    label: الإنجازات والفعاليات
    type: collection
    path: _achievements
    filename: { template: "{year}-{month}-{day}-{primary}.md", field: create }
    view: { primary: title, sort: date, order: desc, fields: [title, date] }
    fields:
      - { name: title, label: العنوان, type: string, required: true }
      - { name: title_en, label: "العنوان بالإنجليزي (إذا فاضي ما يظهر في الصفحة الإنجليزية)", type: string }
      - { name: date, label: التاريخ, type: date, required: true }
      - { name: date_label, label: نص التاريخ البديل (اختياري، مثل 2024), type: string }
      - { name: featured, label: إنجاز بارز, type: boolean }
      - { name: image, label: صورة, type: image }
      - { name: tags, label: الفقرات, type: string, list: true }
      - { name: tags_en, label: الفقرات بالإنجليزي, type: string, list: true }
      - { name: body_en, label: الوصف بالإنجليزي, type: text }
      - { name: title_ja, label: "العنوان بالياباني (إذا فاضي ما يظهر في الصفحة اليابانية)", type: string }
      - { name: tags_ja, label: الفقرات بالياباني, type: string, list: true }
      - { name: body_ja, label: الوصف بالياباني, type: text }
      - { name: body, label: الوصف, type: rich-text }

  - name: gallery
    label: أعمال الأعضاء
    type: collection
    path: _gallery
    filename: { template: "{year}-{month}-{day}-{primary}.md", field: create }
    view: { primary: title, sort: date, order: desc, fields: [title, builder, grade] }
    fields:
      - { name: title, label: اسم الموديل, type: string, required: true }
      - { name: title_en, label: اسم الموديل (English), type: string }
      - { name: title_ja, label: اسم الموديل (日本語), type: string }
      - { name: builder, label: اسم العضو, type: string }
      - name: grade
        label: الفئة
        type: select
        options:
          values: [HG, RG, MG, PG, SD, EG, MGEX, Other]
      - { name: image, label: الصورة, type: image, required: true }
      - { name: date, label: تاريخ الإضافة, type: date }
      - { name: order, label: الترتيب (رقم أصغر يطلع أول), type: number }

  - name: faq
    label: الأسئلة الشائعة
    type: file
    path: _data/faq.yml
    format: yaml
    list: true
    fields:
      - { name: question, label: السؤال, type: string }
      - { name: answer, label: الجواب, type: text }

  - name: faq_en
    label: الأسئلة الشائعة (English)
    type: file
    path: _data/faq_en.yml
    format: yaml
    list: true
    fields:
      - { name: question, label: Question, type: string }
      - { name: answer, label: Answer, type: text }

  - name: faq_ja
    label: الأسئلة الشائعة (日本語)
    type: file
    path: _data/faq_ja.yml
    format: yaml
    list: true
    fields:
      - { name: question, label: Question, type: string }
      - { name: answer, label: Answer, type: text }

  - name: team
    label: فريق النادي
    type: file
    path: _data/team.yml
    format: yaml
    list: true
    fields:
      - { name: name, label: الاسم (عربي), type: string }
      - { name: name_en, label: الاسم (English), type: string }
      - { name: name_ja, label: الاسم (日本語), type: string }
      - { name: desc, label: وصف قصير (عربي), type: text }
      - { name: desc_en, label: وصف قصير (English), type: text }
      - { name: desc_ja, label: وصف قصير (日本語), type: text }
      - { name: url, label: رابط (اختياري), type: string }
      - { name: url_en, label: رابط الإنجليزية (اختياري), type: string }
      - { name: url_ja, label: رابط اليابانية (اختياري), type: string }

  - name: guests
    label: ضيوف النادي الدوليون
    type: file
    path: _data/guests.yml
    format: yaml
    list: true
    fields:
      - { name: name, label: الاسم, type: string }
      - { name: origin, label: البلد (عربي), type: string }
      - { name: origin_en, label: البلد (English), type: string }
      - { name: origin_ja, label: البلد (日本語), type: string }
      - { name: year, label: التاريخ, type: string }
      - { name: image, label: الصورة, type: image }
      - { name: desc, label: الوصف (عربي), type: text }
      - { name: desc_en, label: الوصف (English), type: text }
      - { name: desc_ja, label: الوصف (日本語), type: text }
      - { name: url, label: رابط المقال (عربي), type: string }
      - { name: url_en, label: رابط المقال (English), type: string }
      - { name: url_ja, label: رابط المقال (日本語), type: string }
      - { name: real_name, label: الاسم الحقيقي (عربي), type: string }
      - { name: real_name_en, label: الاسم الحقيقي (English), type: string }
      - { name: real_name_ja, label: الاسم الحقيقي (日本語), type: string }
      - { name: role, label: المنصب (عربي), type: string }
      - { name: role_en, label: المنصب (English), type: string }
      - { name: role_ja, label: المنصب (日本語), type: string }
      - { name: photo, label: الصورة, type: image }
      - { name: link, label: رابط الحساب, type: string }

  - name: press
    label: ظهرنا في (الإعلام)
    type: file
    path: _data/press.yml
    format: yaml
    list: true
    fields:
      - { name: kind, label: النوع (TV / MAGAZINE / BOOK / VIDEO), type: string }
      - { name: year, label: السنة, type: string }
      - { name: name, label: الاسم (عربي), type: string }
      - { name: name_en, label: الاسم (English), type: string }
      - { name: name_ja, label: الاسم (日本語), type: string }
      - { name: desc, label: الوصف (عربي), type: text }
      - { name: desc_en, label: الوصف (English), type: text }
      - { name: desc_ja, label: الوصف (日本語), type: text }
      - { name: url, label: الرابط, type: string }
      - { name: url_en, label: الرابط (English، اختياري), type: string }
      - { name: url_ja, label: الرابط (日本語، اختياري), type: string }
      - { name: image, label: "الصورة المصغرة: اسم الملف داخل assets/images/press (مثل newtype-2023-12.jpg)", type: string }
      - name: image_fit
        label: "طريقة عرض الصورة: cover تملأ الإطار · contain للأغلفة بدون قص"
        type: select
        options: { values: [cover, contain] }

  - name: sponsors
    label: الرعاة
    type: file
    path: _data/sponsors.yml
    format: yaml
    list: true
    fields:
      - { name: name, label: اسم الراعي, type: string }
      - { name: logo, label: الشعار, type: image }
      - { name: url, label: الرابط, type: string }

  - name: social
    label: الحسابات الاجتماعية
    type: file
    path: _data/social.yml
    format: yaml
    list: true
    fields:
      - { name: name, label: المنصة, type: string }
      - name: icon
        label: الأيقونة
        type: select
        options:
          values: [instagram, x, tiktok, youtube]
      - { name: url, label: الرابط, type: string }
