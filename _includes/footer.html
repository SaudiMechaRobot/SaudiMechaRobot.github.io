<div class="join" id="join"><div class="wrap">
  <div><span class="tag">JOIN THE SQUAD</span><h2>{{ t.join_title }}</h2><p>{{ t.join_text }}</p></div>
  <div class="cta">
    {%- for s in site.data.social %}
    <a class="btn {% if forloop.first %}primary{% else %}social{% endif %}" href="{{ s.url }}" target="_blank" rel="noopener me">{{ s.name }}</a>
    {%- endfor %}
  </div>
</div></div>
<footer><div class="wrap">
  <span>© {{ site.time | date: "%Y" }} Saudi Mecha Robot · {{ t.footer_club }} · <a href="https://www.instagram.com/gundam.dizer" target="_blank" rel="noopener">{{ t.club_leader }}</a> · <a href="https://linktr.ee/saudimecharobot" target="_blank" rel="noopener me">Linktree</a></span>
  <span class="tag">EST. {{ site.founded }} · RIYADH</span>
</div></footer>
