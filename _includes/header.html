{%- assign home = t.home_url | relative_url -%}
<header>
  <div class="wrap nav">
    <a class="brand" href="{{ home }}"><span class="mark"><i></i></span><b>Saudi Mecha Robot</b></a>
    <ul>
      <li><a href="{{ home }}#about">{{ t.nav_about }}</a></li>
      <li><a href="{{ home }}#log">{{ t.nav_log }}</a></li>
      <li><a href="{{ home }}#gallery">{{ t.nav_gallery }}</a></li>
      <li><a href="{{ t.blog_url | relative_url }}">{{ t.nav_blog }}</a></li>
      <li><a href="{{ home }}#faq">{{ t.nav_faq }}</a></li>
      <li><a class="lang" href="{{ other_url | relative_url }}" hreflang="{{ t.switch_lang }}" lang="{{ t.switch_lang }}">{{ t.switch_label }}</a></li>
    </ul>
  </div>
</header>
