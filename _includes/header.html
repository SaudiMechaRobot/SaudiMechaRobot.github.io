{%- assign home = t.home_url | relative_url -%}
<header>
  <div class="wrap nav">
    <a class="brand" href="{{ home }}"><img class="logo" src="{{ '/assets/images/logo-192.png' | relative_url }}" alt="" width="64" height="64"><b>Saudi Mecha Robot</b></a>
    <ul>
      <li><a href="{{ home }}#about">{{ t.nav_about }}</a></li>
      <li><a href="{{ home }}#log">{{ t.nav_log }}</a></li>
      <li><a href="{{ home }}#gallery">{{ t.nav_gallery }}</a></li>
      <li><a href="{{ t.blog_url | relative_url }}">{{ t.nav_blog }}</a></li>
      <li><a href="{{ home }}#faq">{{ t.nav_faq }}</a></li>
      <li class="langs">{% for pair in lang_urls %}{% assign kv = pair | split: "|" %}<a class="lang{% if kv[0] == L %} current{% endif %}" href="{{ kv[1] | relative_url }}" hreflang="{{ kv[0] }}" lang="{{ kv[0] }}"{% if kv[0] == L %} aria-current="true"{% endif %}>{{ site.data.i18n[kv[0]].lang_name }}</a>{% endfor %}</li>
    </ul>
  </div>
</header>
