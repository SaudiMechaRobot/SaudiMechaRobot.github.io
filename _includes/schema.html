<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "@id": "{{ '/#organization' | absolute_url }}",
  "name": "Saudi Mecha Robot",
  "alternateName": ["نادي سعودي ميكا روبوت", "سعودي ميكا روبوت", "サウジ・メカ・ロボット"],
  "url": "{{ '/' | absolute_url }}",
  "logo": "{{ site.logo | absolute_url }}",
  "email": "{{ site.email }}",
  "contactPoint": {"@type": "ContactPoint", "contactType": "media and sponsorship", "email": "{{ site.email }}", "availableLanguage": ["Arabic", "English", "Japanese"]},
{%- assign dk = "description_" | append: L %}{%- assign sk = "slogan_" | append: L %}
  "description": {{ site[dk] | default: site.description | jsonify }},
  "slogan": {{ site[sk] | default: site.slogan | jsonify }},
  "image": "{{ '/assets/images/og-image.jpg' | absolute_url }}",
  "foundingDate": "{{ site.founded }}",
  "foundingLocation": {"@type": "Place", "name": "Riyadh, Saudi Arabia"},
  "address": {"@type": "PostalAddress", "addressLocality": "Riyadh", "addressCountry": "SA"},
  "areaServed": {"@type": "Country", "name": "Saudi Arabia"},
  "knowsAbout": ["Scale modeling", "Model kits", "Figures", "Science fiction", "Mechanical design", "Anime", "Video games", "Gunpla", "Plamodel", "Japanese culture"],
  "sameAs": {{ site.social.links | jsonify }}
}
</script>
{%- if page.faq %}{% if L == "ar" %}{% assign faqs = site.data.faq %}{% else %}{% assign fk = "faq_" | append: L %}{% assign faqs = site.data[fk] %}{% endif %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {%- for f in faqs %}
    {"@type": "Question", "name": {{ f.question | jsonify }}, "acceptedAnswer": {"@type": "Answer", "text": {{ f.answer | jsonify }}}}{% unless forloop.last %},{% endunless %}
    {%- endfor %}
  ]
}
</script>
{%- endif %}
