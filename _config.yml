# إعدادات موقع نادي Saudi Mecha Robot
title: Saudi Mecha Robot
tagline: نادي سعودي ميكا روبوت
description: نادي سعودي معتمد من برنامج جودة الحياة، تأسس في الرياض عام 2024 لعشاق Gundam وGrendizer وعالم Super Robot والثقافة اليابانية، يجمع هواة الـ Plamodel وتركيب Gunpla عبر فعاليات وورش للمبتدئين وتحديات تركيب جماعية.
url: https://saudimecharobot.com
baseurl: ""
lang: ar
timezone: Asia/Riyadh
founded: "2024"
email: saudijapanclub@gmail.com
city: الرياض
logo: /assets/images/logo-512.png

social:
  name: Saudi Mecha Robot
  links:
    - https://www.instagram.com/saudi.mecha.robot
    - https://x.com/SaudiMechaRobot
    - https://www.youtube.com/@saudimecharobot
    - https://linktr.ee/saudimecharobot
    - https://www.wikidata.org/wiki/Q141756771

twitter:
  username: SaudiMechaRobot

permalink: /blog/:year/:month/:title/

# لغات الموقع — الترتيب يحدد ترتيب زر اللغات
languages: [ar, en, ja]

collections:
  achievements:
    output: false
  gallery:
    output: false

defaults:
  - scope: { path: "" }
    values: { lang: ar }
  - scope: { path: "", type: pages }
    values: { image: /assets/images/og-image.jpg }
  - scope: { path: "en" }
    values: { lang: en }
  - scope: { path: "ja" }
    values: { lang: ja }
  - scope: { path: "", type: posts }
    values: { layout: post, lang: ar, author: { type: Organization, name: "Saudi Mecha Robot", url: "https://saudimecharobot.com/" }, image: /assets/images/og-image.jpg }
  - scope: { path: "_posts/en", type: posts }
    values: { layout: post, lang: en, author: { type: Organization, name: "Saudi Mecha Robot", url: "https://saudimecharobot.com/" }, image: /assets/images/og-image.jpg, permalink: "/en/blog/:year/:month/:title/" }
  - scope: { path: "_posts/ja", type: posts }
    values: { layout: post, lang: ja, author: { type: Organization, name: "Saudi Mecha Robot", url: "https://saudimecharobot.com/" }, image: /assets/images/og-image.jpg, permalink: "/ja/blog/:year/:month/:title/" }

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

exclude:
  - README.md
  - .pages.yml
