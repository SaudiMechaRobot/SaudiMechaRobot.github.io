  desc: 'حضر معرض «مانغا هوكوساي مانغا: استكشاف مجموعة أعمال الفنان من منظور القصص المصورة المعاصرة»، الذي تناول الصلات بين أعمال كاتسوشيكا هوكوساي والمانغا اليابانية المعاصرة، ضمن فعاليات الذكرى السبعين للعلاقات السعودية اليابانية.'
  desc_en: 'Visited the exhibition “Manga Hokusai Manga: Approaching the Master''s Compendium from the Perspective of Contemporary Comics”, which explored links between Katsushika Hokusai''s work and contemporary Japanese manga. Held for the 70th anniversary of Japan–Saudi relations.'
