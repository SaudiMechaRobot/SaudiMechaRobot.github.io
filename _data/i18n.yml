  about_p1: Saudi Mecha Robot نادي سعودي تأسس في الرياض عام 2024، يهتم بعالم Gundam وGrendizer وSuper Robot والثقافة اليابانية، ومساحة يلتقي فيها هواة الـ Plamodel والمجسمات من مختلف مدن المملكة.
  about_p2: هدفنا نقرّب هواية تركيب المجسمات من الشباب السعودي، ونبني جسر ثقافي بين السعودية واليابان من خلال فن الميكا.
