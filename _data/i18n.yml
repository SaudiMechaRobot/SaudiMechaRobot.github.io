  about_paras:
  - Saudi Mecha Robot is a Saudi club for model kit and figure enthusiasts, accredited by the Quality of Life Program and founded in Riyadh in 2024. The club brings together fans of models and figures inspired by the worlds of anime, manga, and video games, with a special focus on Gundam, Grendizer, and Super Robot.
  - We aim to be a cultural bridge connecting the Kingdom of Saudi Arabia with Japan through a hobby that combines passion, creativity, and cultural exchange. The club’s presence has extended to Japan through appearances on Japanese television and in Japanese magazines, as well as by building friendships and connections with enthusiasts and creators in the mecha and model-building communities from Japan and other countries, while also sharing Saudi culture with them.
  - The club seeks to promote model building among Saudi youth, provide a welcoming environment where beginners and experienced builders can learn, experiment, and exchange knowledge, and build a community that brings together people interested in this hobby and Japanese culture in the Kingdom.
  - We believe that passion is the starting point, and that a hobby can serve as a bridge for creativity, friendship, and cultural exchange.
  - Everyone is welcome.
