  about_lead: Saudi Mecha Robot — نادٍ سعودي للثقافة الميكا والنماذج التركيبية
  about_paras:
  - تأسس Saudi Mecha Robot في الرياض عام 2024، وهو نادٍ معتمد من برنامج جودة الحياة، يُعنى بالنماذج التركيبية والمجسمات المستوحاة من الأنمي والمانجا والألعاب الإلكترونية، مع اهتمام خاص بعوالم Gundam وGrendizer وSuper Robot.
  - يعمل النادي على تعزيز حضور ثقافة الميكا والنماذج التركيبية في المملكة، من خلال الأنشطة وورش العمل وتبادل الخبرات، بما يتيح للمهتمين اكتشاف هذه الثقافة وممارسة جوانبها الإبداعية.
  - ويولي النادي اهتمامًا بالتواصل الثقافي بين السعودية واليابان، مستفيدًا من حضوره الإعلامي في اليابان وعلاقاته مع مهتمين ومبدعين في مجال الميكا والنماذج التركيبية، إلى جانب التعريف بالثقافة السعودية من خلال هذا التواصل.
  - يهدف النادي إلى نشر هواية تركيب النماذج والمجسمات بين الشباب السعودي، وتوفير بيئة مرحّبة تتيح للمبتدئين والمحترفين التعلم والتجربة وتبادل الخبرات، وبناء مجتمع يجمع المهتمين بهذه الهواية والثقافة اليابانية في المملكة.
  - نؤمن بأن الشغف نقطة البداية، وأن الهواية يمكن أن تكون جسرًا للإبداع والصداقة والتبادل الثقافي.
  - نرحب بالجميع.
