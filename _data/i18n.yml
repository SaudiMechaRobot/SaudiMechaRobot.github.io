  about_title: About the club
  about_p1: Saudi Mecha Robot was founded in Riyadh in 2024. It is a meeting place for model kit builders across Saudi Arabia who love Gundam, Grendizer, Super Robot and Japanese pop culture.
  about_p2: Our goal is to grow the model-building hobby among young Saudis and to act as a cultural bridge between Saudi Arabia and Japan through mecha.
