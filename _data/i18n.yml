  about_title: クラブ紹介
  about_p1: Saudi Mecha Robot（サウジ・メカ・ロボット）は、2024年にリヤドで設立されたクラブです。ガンダム、グレンダイザー、スーパーロボット、そして日本のポップカルチャーを愛するサウジアラビア各地のモデラーが集まっています。
  about_p2: 私たちの目標は、サウジアラビアの若い世代にプラモデルの楽しさを広め、メカを通じてサウジアラビアと日本の文化の架け橋になることです。
