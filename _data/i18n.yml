  about_paras:
  - Saudi Mecha Robot（サウジ・メカ・ロボット）は、2024年にリヤドで設立されたスケールモデル＆フィギュアクラブです。サウジアラビアの「クオリティ・オブ・ライフ・プログラム」の認定を受けて活動しています。
  - アニメ・ゲーム・映画に登場するSFやメカニカルデザインを中心に、ガンダムやグレンダイザーからマクロス、エヴァンゲリオン、アーマード・コアまで幅広く楽しんでいます。もちろん、ミリタリー、航空機、カーモデル、ジオラマなど、どんなジャンルの模型も大歓迎です。
  - 私たちの目標は、模型づくりという趣味を通して、サウジアラビアと日本、そして世界をつなぐ「文化の架け橋」になることです。情熱や創造性を分かち合いながら、文化交流の輪を広げていきたいと考えています。
  - 日本のテレビ番組への出演や雑誌への掲載をきっかけに、日本でも少しずつクラブを知っていただけるようになりました。世界各地のメカ・模型ファンやクリエイターの皆さんと交流を深めながら、サウジアラビアの文化も発信しています。また、プロモデラーや審査員の方々をお招きして、本格的な技術に触れられる場づくりにも取り組んでいます。
  - "クラブの目標は、次の3つです。<br>・サウジアラビアの若い世代に、模型づくりの楽しさを広めること<br>・初心者からベテランまで、誰もが学び、挑戦し、知識を分かち合える居心地のよい場をつくること<br>・模型と日本文化を愛する人たちが集うコミュニティを育てること"
  - すべての始まりは「好き」という情熱。趣味には、創造性や友情、そして文化交流を生み出す力がある――私たちはそう信じています。
  - 経験は問いません。どなたでもお気軽にご参加ください！
