  about_lead: Saudi Mecha Robot — نادٍ سعودي للمجسمات والنماذج التركيبية
  about_paras:
  - تأسس Saudi Mecha Robot في الرياض عام 2024، وهو نادٍ معتمد من برنامج جودة الحياة، يُعنى بالنماذج التركيبية والمجسمات، ويركّز على الخيال العلمي والتصميم الميكانيكي كما يظهر في الأنمي وألعاب الفيديو والأفلام، من Gundam وGrendizer إلى Macross وEvangelion وArmored Core، مع تقدير كل أنواع النماذج الأخرى، من العسكرية والطائرات إلى السيارات والدايوراما.
  - يعمل النادي على تعزيز حضور هواية النماذج التركيبية والمجسمات في المملكة، من خلال الأنشطة وورش العمل وتبادل الخبرات، بما يتيح للمهتمين التعرّف على هذه الهواية وممارسة جوانبها الإبداعية.
  - ويسعى النادي لأن يكون جسرًا ثقافيًا بين السعودية واليابان والعالم، مستندًا إلى حضوره الإعلامي في اليابان وعلاقاته مع مهتمين ومبدعين في مجال النماذج التركيبية والمجسمات، إلى جانب التعريف بالثقافة السعودية من خلال هذا التواصل.
  - ويمتد نشاط النادي إلى التواصل مع المحترفين والمبدعين في مجال النماذج التركيبية والمجسمات في اليابان ودول أخرى، بما يتيح تبادل الخبرات واستكشاف فرص التعاون والاستضافة في المملكة. وقد استضاف النادي محترفين ومحكّمين في هذا المجال وتعاون معهم لتقديم تجارب متخصصة تجمع بين المعرفة الفنية والتبادل الثقافي. ويسعى النادي إلى تطوير هذه المبادرات واستقطاب المزيد من الخبرات الدولية مستقبلًا.
  - يهدف النادي إلى نشر هواية تركيب النماذج والمجسمات بين الشباب السعودي، وتوفير بيئة مرحّبة تتيح للمبتدئين والمحترفين التعلم والتجربة وتبادل الخبرات، وبناء مجتمع يجمع المهتمين بهذه الهواية والثقافة اليابانية في المملكة.
  - نؤمن بأن الشغف نقطة البداية، وأن الهواية يمكن أن تكون جسرًا للإبداع والصداقة والتبادل الثقافي.
  - نرحب بالجميع.
