  about_paras:
  - Saudi Mecha Robot نادي سعودي لهواة تركيب النماذج والمجسمات، معتمد من برنامج جودة الحياة، وتأسس في الرياض عام 2024. يجمع النادي هواة النماذج والمجسمات المستوحاة من عوالم الأنمي والمانجا والألعاب الإلكترونية، مع اهتمام خاص بعوالم Gundam وGrendizer وSuper Robot.
  - نسعى لأن نكون جسرًا ثقافيًا يربط المملكة العربية السعودية باليابان، من خلال هواية تجمع بين الشغف والإبداع والتبادل الثقافي. وقد امتد حضور النادي إلى اليابان عبر ظهورنا على التلفزيون الياباني وفي المجلات اليابانية، وبناء علاقات وصداقات مع مهتمين ومبدعين في مجالات الميكا والمجسمات من اليابان ودول أخرى، إلى جانب مشاركة ثقافتنا السعودية معهم.
  - يهدف النادي إلى نشر هواية تركيب النماذج والمجسمات بين الشباب السعودي، وتوفير بيئة مرحّبة تتيح للمبتدئين والمحترفين التعلم والتجربة وتبادل الخبرات، وبناء مجتمع يجمع المهتمين بهذه الهواية والثقافة اليابانية في المملكة.
  - نؤمن بأن الشغف نقطة البداية، وأن الهواية يمكن أن تكون جسرًا للإبداع والصداقة والتبادل الثقافي.
  - نرحب بالجميع.
