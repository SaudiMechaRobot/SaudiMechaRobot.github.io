  about_lead: Saudi Mecha Robot — نادٍ سعودي للمجسمات والنماذج التركيبية
  about_paras:
  - تأسس Saudi Mecha Robot في الرياض عام 2024، وهو نادي هواة مسجّل رسميًا، يُعنى بالنماذج التركيبية والمجسمات، ويركّز على الخيال العلمي والتصميم الميكانيكي كما يظهر في الأنمي وألعاب الفيديو والأفلام، من Gundam وGrendizer إلى Macross وEvangelion وArmored Core، مع تقدير كل أنواع النماذج الأخرى، من العسكرية والطائرات إلى السيارات والدايوراما.
  - يعمل النادي على تعزيز حضور هواية النماذج التركيبية والمجسمات في المملكة، من خلال الأنشطة وورش العمل وتبادل الخبرات، بما يتيح للمهتمين التعرّف على هذه الهواية وممارسة جوانبها الإبداعية.
  - ويسعى النادي لأن يكون جسرًا ثقافيًا بين السعودية واليابان والعالم، مستندًا إلى حضوره الإعلامي في اليابان وعلاقاته مع مهتمين ومبدعين في مجال النماذج التركيبية والمجسمات، إلى جانب التعريف بالثقافة السعودية من خلال هذا التواصل.
  - ويمتد نشاط النادي إلى التواصل مع المحترفين والمبدعين في مجال النماذج التركيبية والمجسمات في اليابان ودول أخرى، بما يتيح تبادل الخبرات واستكشاف فرص التعاون والاستضافة في المملكة. وقد استضاف النادي محترفين ومحكّمين في هذا المجال وتعاون معهم لتقديم تجارب متخصصة تجمع بين المعرفة الفنية والتبادل الثقافي. ويسعى النادي إلى تطوير هذه المبادرات واستقطاب المزيد من الخبرات الدولية مستقبلًا.
  - يهدف النادي إلى نشر هواية تركيب النماذج والمجسمات بين المهتمين في المملكة، وتوفير بيئة مرحّبة تتيح للمبتدئين والمحترفين التعلم والتجربة وتبادل الخبرات. ويجمع النادي مشاركين من الشباب والفتيات، ويسعى لأن يكون مجتمعًا يجمع محبي هذه الهواية والثقافة اليابانية في المملكة.
  - كما يطمح النادي لأن يكون نافذة ثقافية تمثل المملكة، من خلال التواصل مع الأصدقاء والمتابعين من مختلف دول العالم، وبناء جسور من الاهتمام المتبادل حول هواية النماذج والثقافة اليابانية.
  - نؤمن بأن الشغف نقطة البداية، وأن الهواية يمكن أن تكون جسرًا للإبداع والصداقة والتبادل الثقافي.
  - يتبنّى النادي نموذج المشاركة المفتوحة؛ فلا توجد عضوية أو رسوم اشتراك، والمشاركة في أنشطته متاحة لكل المهتمين عبر التسجيل في كل فعالية عند الإعلان عنها.
  - نرحب بالجميع.
