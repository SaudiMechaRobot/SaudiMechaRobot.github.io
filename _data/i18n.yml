  about_paras:
  - Saudi Mecha Robot is an officially registered scale model and figure club founded in Riyadh in 2024. We focus on sci-fi and mechanical design as seen in anime, video games and film, from Gundam and Grendizer to Macross, Evangelion and Armored Core, while appreciating every genre of scale modelling, from military and aviation to automotive and dioramas.
  - We aim to be a cultural bridge between Saudi Arabia, Japan and the world through a hobby that combines passion, creativity, and cultural exchange. The club’s presence has extended to Japan through appearances on Japanese television and in Japanese magazines, as well as by building friendships and connections with enthusiasts and creators in the mecha and model-building communities from Japan and other countries, while also sharing Saudi culture with them. The club has also hosted and collaborated with professional modelers and competition judges to offer specialized experiences.
  - The club seeks to promote model building among enthusiasts in the Kingdom and to provide a welcoming environment where beginners and experienced builders can learn, experiment and exchange knowledge. It brings together young men and young women, and it aims to be a community that brings together lovers of this hobby and Japanese culture in the Kingdom.
  - The club also aspires to be a cultural window representing Saudi Arabia, connecting with friends and followers from around the world and building bridges of shared interest around model building and Japanese culture.
  - We believe that passion is the starting point, and that a hobby can serve as a bridge for creativity, friendship, and cultural exchange.
  - The club follows an open participation model: there is no membership or subscription fee, and anyone interested can take part in its activities by registering for each event when it is announced.
  - Everyone is welcome.
