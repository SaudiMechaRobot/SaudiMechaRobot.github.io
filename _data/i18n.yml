  about_paras:
  - Saudi Mecha Robot is a scale model and figure club founded in Riyadh in 2024 and accredited by the Quality of Life Program. We focus on sci-fi and mechanical design as seen in anime, video games and film, from Gundam and Grendizer to Macross, Evangelion and Armored Core, while appreciating every genre of scale modelling, from military and aviation to automotive and dioramas.
  - We aim to be a cultural bridge from Saudi Arabia to the world through a hobby that combines passion, creativity, and cultural exchange. The club’s presence has extended to Japan through appearances on Japanese television and in Japanese magazines, as well as by building friendships and connections with enthusiasts and creators in the mecha and model-building communities from Japan and other countries, while also sharing Saudi culture with them. The club has also hosted and collaborated with professional modelers and competition judges to offer specialized experiences.
  - The club seeks to promote model building among Saudi youth, provide a welcoming environment where beginners and experienced builders can learn, experiment, and exchange knowledge, and build a community that brings together people interested in this hobby and Japanese culture in the Kingdom.
  - We believe that passion is the starting point, and that a hobby can serve as a bridge for creativity, friendship, and cultural exchange.
  - Everyone is welcome.
