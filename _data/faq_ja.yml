- question: 経験がなくても参加できますか？
  answer: はい、大歓迎です！まったくの未経験からでも学べるワークショップを開催していますので、安心してご参加ください。
- question: ガンプラ専門のクラブですか？
  answer: いいえ。アニメやゲームのSF・メカニカルデザインを中心にしつつ、ミリタリー、航空機、カーモデル、ジオラマなど、あらゆるジャンルの模型・フィギュアを歓迎しています。名前の「メカ」は私たちの原点で、作業台はすべての模型に開かれています。
- question: イベントはどこで開催されますか？
  answer: クラブの拠点はサウジアラビアのリヤドです。各イベントの会場と日程は公式アカウントでお知らせします。
- question: 最初のガンプラに必要な道具は何ですか？
  answer: ニッパー、ヤスリ（紙ヤスリでもOK）、デザインナイフの3つがあれば、はじめてのHGキットは十分に作れます。
- question: HG・RG・MG・PGの違いは何ですか？
  answer: HGは1/144スケールで、最初の一体に最適です。RGは同じ1/144スケールで、より精密なディテールが特徴です。MGは1/100スケールで内部フレームがあります。PGは1/60スケールで、最も大きく精密なグレードです。
- question: 日本から交流することはできますか？
  answer: もちろんです。日本のモデラーやメカファンの皆さんとの交流を楽しみにしています。SNSから気軽にメッセージをお送りください。
- question: クラブへの連絡方法を教えてください。
  answer: Instagram、X、TikTok、YouTubeの公式アカウントからご連絡ください。リンクはページ下部にあります。
