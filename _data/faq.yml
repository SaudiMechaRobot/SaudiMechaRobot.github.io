- question: هل يجب أن أكون محترفاً للانضمام؟
  answer: لا، النادي يُرحب بالمبتدئين، ولدينا ورش عمل تبدأ معك من الصفر.
- question: أين تُقام فعاليات النادي؟
  answer: يقع مقر النادي في الرياض، ونُعلن عن مكان وموعد كل فعالية عبر حساباتنا الرسمية.
- question: ما الأدوات التي أحتاجها لأول مجسم Gunpla؟
  answer: قصّاصة (Nipper)، ومبرد أو ورق صنفرة ناعم، وسكين هواية (مشرط). هذه الأدوات تكفيك للبدء بأول مجسم من فئة HG.
- question: ما الفرق بين فئات HG و RG و MG و PG؟
  answer: فئة HG تأتي بمقياس 1/144 وهي الأسهل للبداية، وفئة RG تأتي بنفس المقياس ولكن بتفاصيل أدق، بينما فئة MG تأتي بمقياس 1/100 وتحتوي على هيكل داخلي، وأخيراً فئة PG بمقياس 1/60 وهي الأكبر حجماً والأكثر تفصيلاً.
- question: كيف يمكنني التواصل مع النادي؟
  answer: عبر حساباتنا الرسمية في Instagram وX وTikTok، وتجد جميع الروابط في أسفل الصفحة.
