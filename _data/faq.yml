- question: هل يجب أن أكون محترفاً للمشاركة؟
  answer: لا، النادي يُرحب بالمبتدئين، ولدينا ورش عمل تبدأ معك من الصفر.
- question: هل يتطلب النادي عضوية أو اشتراكاً؟
  answer: لا. يتبنّى النادي نموذج المشاركة المفتوحة، فلا توجد عضوية أو رسوم اشتراك، والمشاركة في أنشطتنا وتحدياتنا متاحة للجميع. تابع حساباتنا الرسمية لمعرفة الفعاليات القادمة، ثم سجّل عبر الرابط المرفق في إعلان كل فعالية.
- question: لماذا «نادٍ» وليس مجتمعاً أو مجموعة؟
  answer: لأننا نادٍ مسجّل رسمياً، استلهمنا فكرته من ثقافة نوادي الهوايات (Hobby Clubs) المعروفة في اليابان والعالم، بما تنظّمه من لقاءات ومعارض وتبادل للخبرات. ونسعى لمواكبة مستوى المودلرز العالميين والمحترفين والاستعانة بخبراتهم، مع بقاء الهواية مفتوحة لكل المستويات، من تركيب أول مجسم إلى الأعمال الاحترافية. النادي هو الكيان المنظِّم، والمجتمع هو روحه، والمشاركة مفتوحة للجميع دون عضوية أو اشتراك.
- question: هل النادي مخصص لـ Gunpla فقط؟
  answer: لا. نركّز على الخيال العلمي والتصميم الميكانيكي من الأنمي وألعاب الفيديو، ونرحّب بكل أنواع النماذج التركيبية والمجسمات، من العسكرية والطائرات إلى السيارات والدايوراما. كلمة "Mecha" في اسمنا تعكس بدايتنا، وطاولة العمل مفتوحة للجميع.
- question: أين تُقام فعاليات النادي؟
  answer: يقع مقر النادي في الرياض، ونُعلن عن مكان وموعد كل فعالية عبر حساباتنا الرسمية.
- question: ما الأدوات التي أحتاجها لأول مودل تركيب للنماذج؟
  answer: قصّاصة (Nipper)، ومبرد أو ورق صنفرة ناعم، وسكين هواية (مشرط). هذه الأدوات تكفيك للبدء بأول مجسم من فئة HG.
- question: ما الفرق بين فئات HG و RG و MG و PG في Gunpla؟
  answer: فئة HG تأتي بمقياس 1/144 وهي الأسهل للبداية، وفئة RG تأتي بنفس المقياس ولكن بتفاصيل أدق، بينما فئة MG تأتي بمقياس 1/100 وتحتوي على هيكل داخلي، وأخيراً فئة PG بمقياس 1/60 وهي الأكبر حجماً والأكثر تفصيلاً.
- question: كيف يمكنني التواصل مع النادي؟
  answer: يمكن التواصل عبر الإيميل أو عبر حساباتنا الرسمية في Instagram وX وTikTok، وتجد جميع الروابط في أسفل الصفحة.
