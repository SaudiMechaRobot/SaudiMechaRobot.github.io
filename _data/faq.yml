- question: هل لازم أكون محترف عشان أنضم؟
  answer: لا. النادي يرحّب بالمبتدئين، وعندنا ورش تبدأ معك من الصفر.
- question: وين تقام فعاليات النادي؟
  answer: النادي مقره الرياض، ونعلن عن مكان وموعد كل فعالية في حساباتنا الرسمية.
- question: وش الأدوات اللي أحتاجها لأول موديل Gunpla؟
  answer: قصّاصة (Nipper)، ومبرد أو ورق صنفرة ناعم، وسكين هواية. هذي تكفيك لأول موديل من فئة HG.
- question: وش الفرق بين HG وRG وMG وPG؟
  answer: HG مقياس 1/144 وهو الأسهل للبداية، وRG بنفس المقياس لكن بتفاصيل أدق، وMG مقياس 1/100 بهيكل داخلي، وPG مقياس 1/60 وهو الأكبر والأكثر تفصيلاً.
- question: كيف أتواصل مع النادي؟
  answer: عبر حساباتنا في Instagram وX وTikTok وYouTube، والروابط كلها في أسفل الصفحة.
