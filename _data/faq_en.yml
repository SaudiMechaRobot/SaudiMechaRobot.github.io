- question: Do I need to be experienced to join?
  answer: No. The club welcomes beginners, and our workshops start from zero.
- question: Is the club only for Gunpla?
  answer: No. Our focus is sci-fi and mechanical design from anime and video games, and we welcome every genre of scale models and figures, from military and aviation to automotive and dioramas. "Mecha" in our name reflects where we started; our workbench is open to everyone.
- question: Where are club events held?
  answer: The club is based in Riyadh, Saudi Arabia. We announce the venue and date of each event on our official accounts.
- question: What tools do I need for my first Gunpla kit?
  answer: A pair of nippers, a fine file or sanding paper, and a hobby knife are enough for your first High Grade kit.
- question: What is the difference between HG, RG, MG and PG?
  answer: HG is 1/144 scale and the easiest start. RG is the same scale with finer detail. MG is 1/100 scale with an inner frame. PG is 1/60 scale, the largest and most detailed grade.
- question: Do you welcome visitors and members from outside Saudi Arabia?
  answer: Yes. Modellers from anywhere are welcome to follow the club and connect with us online.
- question: How can I contact the club?
  answer: Through our Instagram, X, TikTok and YouTube accounts. All links are at the bottom of the page.
